[build]
  command = "npm run build"
  publish = ".next"
  node_version = "20"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_DOMAIN,NEXT_PUBLIC_VAPID_PUBLIC_KEY"
  NEXT_PUBLIC_DOMAIN = "https://autonexabrasil.com.br"
  NEXT_PUBLIC_VAPID_PUBLIC_KEY = "BLO5T5OCfn5riMCiORaq1B5eCPP3Q9PVgPihRbV908GgUvhUebYFjlCTNL6SKTeCvt1v1x_tDc6wPQt9Mill24w"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"